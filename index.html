<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Master | Koshish</title>
    <style>
        /* 1. ZEN BACKGROUND & FLOATERS */
        body {
            background: linear-gradient(180deg, #0f172a 0%, #1e40af 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .air-item {
            position: absolute;
            bottom: -100px;
            animation: floatUp 12s linear infinite;
            color: rgba(255, 255, 255, 0.2);
            font-weight: bold;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0; }
            100% { transform: translateY(-120vh); opacity: 0.6; }
        }

        /* 2. GLASS UI DESIGN */
        .glass-container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            padding: 30px;
            width: 90%;
            max-width: 700px;
            text-align: center;
            z-index: 10;
        }

        /* WORD DISPLAY BOX (FastFingers Style) */
        .text-display {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            font-size: 1.4rem;
            line-height: 1.6;
            color: #333;
            text-align: left;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
        }

        .highlight { background: #cbd5e1; border-radius: 5px; padding: 0 5px; }
        .correct { color: #22c55e; }
        .wrong { color: #ef4444; text-decoration: underline; }

        /* CONTROLS */
        .input-row { display: flex; gap: 10px; align-items: center; }

        input {
            flex: 2;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-size: 1.2rem;
            outline: none;
        }

        .timer {
            background: #1e293b;
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            min-width: 60px;
        }

        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-regen { background: #64748b; font-size: 1.5rem; }

        /* LOGIN POPUP */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center; align-items: center;
        }
        .modal-card { background: white; padding: 40px; border-radius: 30px; text-align: center; width: 300px; }
    </style>
</head>
<body>

    <div class="glass-container">
        <div style="display:flex; justify-content: space-between; color:white; opacity:0.7;">
            <span>typing-master:)</span>
            <span id="user-display" onclick="showLogin()" style="cursor:pointer;">[Login]</span>
        </div>

        <div class="text-display" id="text-box">Loading sentence from internet...</div>

        <div class="input-row">
            <input type="text" id="user-input" placeholder="Type here..." autocomplete="off">
            <div class="timer" id="timer">60s</div>
            <button class="btn btn-regen" onclick="fetchNewSentence()" title="Get New Sentence">↻</button>
        </div>

        <p style="color: white; font-weight: bold; opacity: 0.5; margin-top:20px;">MADE BY KOSHISH</p>
    </div>

    <div class="modal" id="loginModal">
        <div class="modal-card" id="modalContent">
            <h2 style="color: #1e3a8a;">Member Login</h2>
            <input type="text" id="fn" placeholder="First Name" style="width:100%; padding:10px; margin:5px 0;"><br>
            <input type="text" id="sn" placeholder="Surname" style="width:100%; padding:10px; margin:5px 0;"><br>
            <button class="btn" style="width:100%; background:#22c55e; margin-top:10px;" onclick="doLogin()">JOIN KOSHISH</button>
        </div>
    </div>

    <script>
        let words = [];
        let wordIdx = 0;
        let time = 60;
        let active = false;
        let clock;

        // 1. FETCH SENTENCE FROM INTERNET (Quotable API)
        async function fetchNewSentence() {
            const textBox = document.getElementById('text-box');
            textBox.innerHTML = "Fetching...";
            try {
                // Fetch random quote with at least 150 characters for practice
                const response = await fetch('https://api.quotable.io/random?minLength=100');
                const data = await response.json();
                words = data.content.split(" ");
                wordIdx = 0;
                renderWords();
            } catch (err) {
                textBox.innerHTML = "Internet error. Check connection.";
            }
        }

        function renderWords() {
            const textBox = document.getElementById('text-box');
            textBox.innerHTML = words.map((w, i) => `<span id="w-${i}">${w}</span>`).join(" ");
            document.getElementById(`w-0`).className = "highlight";
        }

        // 2. TYPING LOGIC
        document.getElementById('user-input').addEventListener('input', (e) => {
            if (!active) startClock();
            
            if (e.target.value.endsWith(" ")) {
                let typed = e.target.value.trim();
                let target = words[wordIdx];
                let el = document.getElementById(`w-${wordIdx}`);
                
                el.className = (typed === target) ? "correct" : "wrong";
                wordIdx++;
                e.target.value = "";
                
                if (wordIdx < words.length) {
                    document.getElementById(`w-${wordIdx}`).className = "highlight";
                } else {
                    fetchNewSentence(); // Automatically get next one when finished
                }
            }
        });

        function startClock() {
            active = true;
            clock = setInterval(() => {
                time--;
                document.getElementById('timer').innerText = time + "s";
                if (time <= 0) {
                    clearInterval(clock);
                    alert("Game Over! Press ↻ to restart.");
                }
            }, 1000);
        }

        // 3. LOGIN LOGIC
        function showLogin() { document.getElementById('loginModal').style.display = 'flex'; }
        function doLogin() {
            const f = document.getElementById('fn').value;
            const s = document.getElementById('sn').value;
            if (f && s) {
                document.getElementById('modalContent').innerHTML = `<h2 style="color:#22c55e;">Welcome, Member!</h2><p>Thanks for logging in ${f} ${s}, you are a member of <b>KOSHISH</b></p>`;
                document.getElementById('user-display').innerText = f;
                setTimeout(() => { document.getElementById('loginModal').style.display = 'none'; }, 2500);
            }
        }

        // 4. FLOATING TEXT
        for(let i=0; i<15; i++) {
            let d = document.createElement('div');
            d.className = 'air-item';
            d.innerText = "MADE BY KOSHISH";
            d.style.left = Math.random() * 100 + "vw";
            d.style.animationDelay = Math.random() * 12 + "s";
            document.body.appendChild(d);
        }

        fetchNewSentence();
    </script>
</body>
</html>
